name: Backend CI/CD (Render)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend_deploy.yml'


jobs:
  # ── Job 1: Build & Test (chạy cả trên PR và push) ─────────────────────────
  test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & run tests
        run: mvn clean verify -B

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ── Job 2: Deploy (chỉ chạy khi push lên main, sau khi test pass) ─────────
  deploy:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          echo "Triggering deploy to Render..."
          # Automatically strip accidental '/deploys' suffix or trailing slashes from the Render ID
          CLEANED_ID=$(echo "${{ secrets.RENDER_ID }}" | sed 's|/deploys||g' | sed 's|/||g')
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --request POST \
            "https://api.render.com/v1/services/${CLEANED_ID}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')
          
          # Extract body and status code
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep 'HTTP_STATUS:' | cut -d':' -f2)
          
          echo "HTTP Status Code: $STATUS"
          echo "Response Body:"
          echo "$BODY"
          
          if [ "$STATUS" -ge 400 ]; then
            echo "❌ Deploy trigger failed with HTTP $STATUS."
            echo "⚠️ Please verify that RENDER_ID and RENDER_API are configured correctly in your GitHub Secrets."
            exit 1
          fi

      - name: Wait for service to start
        run: |
          echo "Waiting 90s for Render to build & boot..."
          sleep 90

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.BACKEND_URL }}/actuator/health")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi