# ===================================================================
# Profile: h2 – Dùng H2 In-Memory khi chưa có MySQL
# Khởi động: java -jar app.jar --spring.profiles.active=h2
# ===================================================================

spring.datasource.url=jdbc:h2:mem:virtual_chem_lab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable schema.sql auto-run (MySQL syntax trong do, H2 khong hieu)
spring.sql.init.mode=never

# Enable H2 console (truy cap http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
