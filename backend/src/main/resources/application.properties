# ===================================================================
# Virtual Chemistry Lab – Application Configuration
# ===================================================================

# --- Server ---
server.port=8080

# --- Supabase PostgreSQL DataSource ---
# Kết nối được quản lý lập trình qua DataSourceConfig.java
# (tránh vấn đề escape ký tự đặc biệt & và % trong .properties)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# Supabase API Keys
app.supabase.url=https://yesykibnglunqlspikin.supabase.co
app.supabase.anon-key=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inllc3lraWJuZ2x1bnFsc3Bpa2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzk1NDQsImV4cCI6MjA5MjYxNTU0NH0.BM7wQGcekMMVow1Z1ouxmfeWLfK9qRy5tRAbu7VNphg
app.supabase.publishable-key=sb_publishable_ymoHe8fduedplZdjbrn9Ng_4VsTRHx2

# --- JPA / Hibernate ---
# ddl-auto=none – schema được quản lý qua Supabase Dashboard / schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Không kết nối DB để đọc metadata khi startup – tránh crash khi Supabase chưa sẵn sàng
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# App – AI Client (Google Gemini)
# ===================================================================
# API key do user cung cap – la Google AI Studio key (bat dau bang AIzaSy)
app.ai.api-key=AIzaSyDItZVMek_XNLeU1lAFsURgcavfrv52klo

# Gemini URL (de trong – AiClient tu dong detect key AIzaSy va goi Gemini)
