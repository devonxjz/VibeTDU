# ===================================================================
# Production profile – safe to commit (NO SECRETS here!)
# ===================================================================
# Secrets (DB URL, API keys, JWT secret) are injected via
# Render Environment Variables at runtime.

# --- Server ---
server.port=${PORT:8080}

# --- DataSource (Supabase PostgreSQL Transaction Pooler) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&defaultRowFetchSize=0&tcpKeepAlive=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.yesykibnglunqlspikin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always

# --- Supabase API Keys ---
app.supabase.url=${APP_SUPABASE_URL:https://yesykibnglunqlspikin.supabase.co}
app.supabase.anon-key=${APP_SUPABASE_ANON_KEY:}
app.supabase.publishable-key=${APP_SUPABASE_PUBLISHABLE_KEY:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# --- Rate Limit ---
app.rate-limit.mix-cooldown-ms=2000

# --- AI Client ---
app.ai.api-keys[0]=${APP_AI_API_KEY:}
app.ai.api-url=${APP_AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.model=${APP_AI_MODEL:llama-3.3-70b-versatile}
app.ai.mock-mode=${APP_AI_MOCK_MODE:false}

# --- Authentication ---
app.auth.google.client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:}

# --- External Chemical APIs ---
app.pubchem.base-url=https://pubchem.ncbi.nlm.nih.gov/rest/pug
app.cactus.base-url=https://cactus.nci.nih.gov/chemical/structure
app.opsin.base-url=https://opsin.ch.cam.ac.uk

# --- SpringDoc OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.defaultModelExpandDepth=3
