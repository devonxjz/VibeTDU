# Test-only config: overrides application.properties for Spring Boot tests
# Uses H2 in-memory DB so tests don't need a Supabase connection.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.show-sql=false

# Placeholder Google Client ID (overridden per test via @MockBean)
app.auth.google.client-id=test-client-id

# JWT secret must be at least 256 bits (32 chars) for HS256
app.auth.jwt.secret=test-secret-key-at-least-32-chars-long!!

# Supabase config (not used in tests but required for bean wiring)
app.supabase.url=http://localhost
app.supabase.anon-key=test
app.supabase.publishable-key=test
app.ai.api-keys[0]=test
app.ai.api-url=http://localhost
app.ai.model=test
app.ai.mock-mode=true
app.cors.allowed-origins=*
