app.supabase.publishable-key=sb_publishable_ymoHe8fduedplZdjbrn9Ng_4VsTRHx2

# --- JPA / Hibernate ---
# ddl-auto=none – schema được quản lý qua Supabase Dashboard / schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Không kết nối DB để đọc metadata khi startup – tránh crash khi Supabase chưa sẵn sàng
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

